# Blueprint для Render: бесплатный веб-сервис Nova.
# Без DATABASE_URL данные живут на диске сервиса и стираются, когда бесплатный сервер засыпает.
# Чтобы данные сохранялись, создайте бесплатную базу PostgreSQL (например, на neon.tech)
# и добавьте её строку подключения в переменную DATABASE_URL в настройках сервиса на Render.
services:
  - type: web
    name: nova
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
